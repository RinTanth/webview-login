services:
  postgres:
    image: postgres:17-alpine
    container_name: webview-login-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: login_db
      POSTGRES_USER: appusr
      POSTGRES_PASSWORD: password
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appusr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
